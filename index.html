<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMDB Browser V13</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="layout">
<aside class="sidebar">
<div class="filters"><h2>TMDB Browser</h2><details id="filtersDetails" open><summary>Filters</summary>
<input id="apiKey" placeholder="TMDB API Key"><select id="sort"><option value="popularity.desc">Popularity Desc</option><option value="revenue.desc">Revenue Desc</option><option value="revenue.asc">Revenue Asc</option><option value="vote_average.desc">Rating Desc</option></select>
<input id="yearMin" type="number" placeholder="Year From"><input id="yearMax" type="number" placeholder="Year To"><select id="genre"></select><select id="language"><option value="">All Languages</option><option value="en">English</option><option value="fr">French</option><option value="de">German</option><option value="es">Spanish</option></select><input id="votesMin" type="number" placeholder="Minimum Votes"><button id="apply">Apply Filters</button><button id="reset">Reset Filters</button></details></div>
<details id="detailsDetails" class="movie-details"><summary>📖 Movie Details</summary><div id="detailsPanel">Hover or tap a movie.</div></details>
</aside>
<main><div id="movieGrid"></div><div class="pager"><button id="prevBtn">Prev</button><span id="pageInfo"></span><input id="jumpPage" type="number" min="1" placeholder="Page"><button id="goBtn">Go</button><button id="nextBtn">Next</button></div></main>
</div><script src="app.js"></script></body></html>
