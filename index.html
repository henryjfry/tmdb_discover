<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMDB Browser V6</title><link rel="stylesheet" href="styles.css"></head><body><div class="layout"><aside class="sidebar"><h2>TMDB Browser</h2><input id="apiKey" placeholder="TMDB API Key"><select id="sort"><option value="popularity.desc">Popularity Desc</option><option value="popularity.asc">Popularity Asc</option><option value="vote_average.desc">Rating Desc</option><option value="release_date.desc">Newest</option><option value="revenue.desc">Revenue Desc</option><option value="revenue.asc">Revenue Asc</option><option value="vote_count.desc">Vote Count Desc</option></select><input id="yearMin" type="number" placeholder="Year From"><input id="yearMax" type="number" placeholder="Year To"><select id="genre"></select><select id="language"><option value="">All Languages</option><option value="en">English</option><option value="fr">French</option><option value="de">German</option><option value="es">Spanish</option><option value="it">Italian</option><option value="ja">Japanese</option></select><input id="votesMin" type="number" placeholder="Minimum Votes"><button id="apply">Apply Filters</button><div id="detailsPanel"><h3>Movie Details</h3><p>Hover over a movie poster.</p></div></aside><main><div id="movieGrid"></div><div class="pager"><button id="prevBtn">Prev</button><span id="pageNo"></span><button id="nextBtn">Next</button></div></main></div><script src="app.js"></script></body></html>
